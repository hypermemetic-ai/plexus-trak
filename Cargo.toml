[package]
name = "plexus-trak"
version = "0.1.0"
edition = "2021"
description = "Recursive work tracker — facets within facets"
license = "AGPL-3.0-only"

[lib]
name = "plexus_trak"
path = "src/lib.rs"

[[bin]]
name = "plexus-trak"
path = "src/bin/main.rs"

[dependencies]
# Plexus RPC
#
# plexus-core is consumed via path dep (workspace) to pick up
# AUTHZ-CORE-CRATE-1 — the migration that re-exports `AuthContext` and other
# auth primitives from `plexus-auth-core`. With the path dep,
# `plexus_core::plexus::AuthContext` IS `plexus_auth_core::AuthContext`,
# so the field-mirroring shim in `TenantGate::from_auth` is gone and the
# trak handlers + resolver primitive share one type.
plexus-core = { path = "../plexus-core", version = "0.5" }
# Workspace path deps for the rest of the plexus stack. Required because
# `plexus-transport` (and `plexus-macros`) pin a workspace `plexus-core`
# via path; mixing path-dep `plexus-core` here with crates.io
# `plexus-transport` produces two distinct `plexus_core` crates in the
# dep graph, which makes `DynamicHub: Activation` fail to satisfy.
#
# `plexus-macros` is pinned at the SAME physical path that plexus-core
# uses so cargo sees one `plexus-macros` package id. The
# AUTHZ-MACRO-OPTIONAL-AUTH-1 worktree has since merged back into the
# canonical `../plexus-macros` checkout (which plexus-core/Cargo.toml
# points at today), so we follow it there. The codegen behavior it
# carried (`Option<&AuthContext>` pass-through; `auth: &AuthContext`
# fail-closed to Unauthenticated at dispatch) is present.
plexus-macros = { path = "../plexus-macros" }
plexus-transport = { path = "../plexus-transport", version = "0.3" }

# Sealed auth primitives (AuthContext re-export target, schema marker
# machinery the `plexus_macros::activation` codegen references by the
# literal path `plexus_auth_core::...`). MUST stay the same package id
# plexus-core uses, or every macro expansion in this crate type-errors.
plexus-auth-core = { path = "../plexus-auth-core", version = "0.1" }

# UT-1 primitives: the generalized TenantGate (predicates / GateDenial /
# TenantTagged), the org_id-default ClaimTenantResolver, and the OIDC
# validator (`oidc::OidcSessionValidator` / `oidc::OidcValidator`) — from
# the UNMERGED feature/UT-1-tenancy-oidc branch, via the local shim crate
# (see ut1-auth-core/Cargo.toml for the full why: cargo lockfile collision
# rules out a second path dep; a renamed direct dep breaks the
# `plexus_macros::activation` codegen's proc-macro-crate resolution).
#
# ████████████████████████████████████████████████████████████████████████
# TODO: repoint to ../plexus-auth-core once feature/UT-1-tenancy-oidc
# merges — delete this dep + the ut1-auth-core/ shim crate, and
# s/plexus_auth_core_ut1/plexus_auth_core/ across src/ + tests/. Also
# delete the UT-W3-MIRROR shims (grep "UT-W3-MIRROR" in src/auth.rs /
# src/tenant_gate.rs).
# ████████████████████████████████████████████████████████████████████████
#
# CONSEQUENCE while unmerged: `plexus_core::plexus::AuthContext` is NOT the
# same nominal type as `plexus_auth_core_ut1::AuthContext`. The
# field-for-field mirror shims (grep "UT-W3-MIRROR") bridge the two.
plexus-auth-core-ut1 = { path = "ut1-auth-core", version = "0.1" }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Regex
regex = "1"

# OIDC issuer URLs (UT-W3): same `url 2` the auth-core crates pin, so
# `url::Url` unifies with `IssuerUrl::try_new`'s parameter type.
url = "2"

# IDs + time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Schema
schemars = { version = "1", features = ["derive"] }

# JSON-RPC (required by plexus-macros)
jsonrpsee = { version = "0.26", features = ["server", "macros"] }

# Storage
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Errors
thiserror = "2"

# CLI
# `env` (UT-W3): --oidc-issuer / --oidc-audience read TRAK_OIDC_ISSUER /
# TRAK_OIDC_AUDIENCE when the flags are absent.
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Auth / Identity
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
srp = "0.6"

[dev-dependencies]
tempfile = "3"
