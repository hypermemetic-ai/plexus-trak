[package]
name = "plexus-trak"
version = "0.1.0"
edition = "2021"
description = "Recursive work tracker — facets within facets"
license = "AGPL-3.0-only"

[lib]
name = "plexus_trak"
path = "src/lib.rs"

[[bin]]
name = "plexus-trak"
path = "src/bin/main.rs"

[dependencies]
# Plexus RPC
plexus-core = "0.5"
plexus-macros = "0.5"
plexus-transport = "0.2"

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Regex
regex = "1"

# IDs + time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Schema
schemars = { version = "1", features = ["derive"] }

# JSON-RPC (required by plexus-macros)
jsonrpsee = { version = "0.26", features = ["server", "macros"] }

# Storage
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Errors
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }
dirs = "6"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Auth / Identity
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
srp = "0.6"

[dev-dependencies]
tempfile = "3"
