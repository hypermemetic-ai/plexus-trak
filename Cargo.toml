[package]
name = "plexus-trak"
version = "0.1.0"
edition = "2021"
description = "Recursive work tracker — facets within facets"
license = "AGPL-3.0-only"

[lib]
name = "plexus_trak"
path = "src/lib.rs"

[[bin]]
name = "plexus-trak"
path = "src/bin/main.rs"

[dependencies]
# Plexus RPC
#
# plexus-core is consumed via path dep (workspace) to pick up
# AUTHZ-CORE-CRATE-1 — the migration that re-exports `AuthContext` and other
# auth primitives from `plexus-auth-core`. With the path dep,
# `plexus_core::plexus::AuthContext` IS `plexus_auth_core::AuthContext`,
# so the field-mirroring shim in `TenantGate::from_auth` is gone and the
# trak handlers + resolver primitive share one type.
plexus-core = { path = "../plexus-core", version = "0.5" }
# Workspace path deps for the rest of the plexus stack. Required because
# `plexus-transport` (and `plexus-macros`) pin a workspace `plexus-core`
# via path; mixing path-dep `plexus-core` here with crates.io
# `plexus-transport` produces two distinct `plexus_core` crates in the
# dep graph, which makes `DynamicHub: Activation` fail to satisfy.
#
# `plexus-macros` is pinned at the SAME physical path that plexus-core
# uses (`../plexus-macros`), so cargo sees one `plexus-macros` package
# id. The previous pin pointed at the long-deleted
# `plexus-macros-AUTHZ-MACRO-OPTIONAL-AUTH-1` worktree (its
# `Option<&AuthContext>` pass-through fix has since landed in
# `plexus-macros` proper), which made this crate unbuildable from
# source (found by R-5 of the ROLES+AP wave; fixed under
# R-7 2e5058cd-fa96-4d14-bcf6-44f62e204ff0).
plexus-macros = { path = "../plexus-macros" }
plexus-transport = { path = "../plexus-transport", version = "0.3" }

# Sealed auth primitives (Tenant, ClaimTenantResolver, AuthContext).
# Path dep so the AuthContext type used in trak handlers is identical to the
# one expected by `ClaimTenantResolver::resolve`.
plexus-auth-core = { path = "../plexus-auth-core", version = "0.1" }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Regex
regex = "1"

# IDs + time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Schema
schemars = { version = "1", features = ["derive"] }

# JSON-RPC (required by plexus-macros)
jsonrpsee = { version = "0.26", features = ["server", "macros"] }

# Storage
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Errors
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }
dirs = "6"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Auth / Identity
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
srp = "0.6"

[dev-dependencies]
tempfile = "3"
